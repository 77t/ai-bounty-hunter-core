name: AI Bounty Hunter - Auto Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Tambahkan ini untuk memastikan semua file ter-checkout dengan benar
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug & Run Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== DEBUG START ==="
          pwd
          ls -la
          
          # Cek manual apakah file ada
          if [ -f "./main_scraper.py" ]; then
            echo "SUCCESS: main_scraper.py found at root!"
            
            echo "=== Installing Dependencies ==="
            pip install -r requirements.txt
            
            echo "=== Running Script ==="
            python main_scraper.py
          else
            echo "FATAL: File still missing even after ls showed it."
            echo "Trying to list all .py files recursively:"
            find . -name "*.py"
            exit 1
          fi
          
