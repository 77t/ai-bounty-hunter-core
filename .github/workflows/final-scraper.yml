      - name: Run Bounty Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== DEBUG INFO ==="
          echo "Current Dir: $(pwd)"
          
          # Cari file main_scraper.py di MANA PUN
          echo "Searching for main_scraper.py..."
          FOUND_FILE=$(find . -name "main_scraper.py" -type f | head -n 1)
          
          if [ -z "$FOUND_FILE" ]; then
            echo "FATAL ERROR: main_scraper.py NOT FOUND ANYWHERE!"
            echo "Listing all files in repository:"
            find . -type f -not -path "./.git/*"
            exit 1
          fi
          
          echo "File found at: $FOUND_FILE"
          
          # Ambil direktori file tersebut
          SCRIPT_DIR=$(dirname "$FOUND_FILE")
          echo "Script Directory: $SCRIPT_DIR"
          
          # Pindah ke direktori script
          cd "$SCRIPT_DIR"
          echo "New Current Dir: $(pwd)"
          
          # List isi folder untuk konfirmasi
          ls -la
          
          echo "=== Installing Dependencies ==="
          pip install -r requirements.txt
          
          echo "=== Running Script ==="
          python main_scraper.py
