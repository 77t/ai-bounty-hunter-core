name: AI Bounty Hunter - Auto Scan

on:
  schedule:
    # Jalankan setiap 15 menit (Waktu UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan manual kapan saja

jobs:
  hunt:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Bounty Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main_scraper.py


        # Force trigger - $(date)(Ganti  $(date)  dengan tanggal hari ini, misal:  # Force trigger - 2024-01-15 )
        
        
