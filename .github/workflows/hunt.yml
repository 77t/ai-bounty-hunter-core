name: AI Super Hunter - Auto Scan & Work

on:
  schedule:
    - cron: '*/15 * * * *'  # Jalan setiap 15 menit
  workflow_dispatch:        # Bisa manual trigger juga

jobs:
  hunt:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama & Pull Qwen2.5 Model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve & 
          sleep 5
          ollama pull qwen2.5:7b-instruct-q4_K_M

      - name: Run AI Super Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python main_scraper.py
        
