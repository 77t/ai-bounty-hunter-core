name: AI Bounty Hunter - Auto Scan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug & Find Files
        run: |
          echo "=== LISTING ALL FILES ==="
          find . -type f
          
          echo "=== FINDING REQUIREMENTS.TXT ==="
          REQ=$(find . -iname "requirements.txt" | head -n 1)
          if [ -z "$REQ" ]; then echo "ERROR: requirements.txt NOT FOUND"; exit 1; fi
          echo "Found requirements at: $REQ"
          
          echo "=== FINDING MAIN_SCRAPER.PY ==="
          SCRIP=$(find . -iname "main_scraper.py" | head -n 1)
          if [ -z "$SCRIP" ]; then echo "ERROR: main_scraper.py NOT FOUND"; exit 1; fi
          echo "Found script at: $SCRIP"

      - name: Install Dependencies
        run: |
          REQ=$(find . -iname "requirements.txt" | head -n 1)
          pip install -r "$REQ"

      - name: Run Bounty Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SCRIP=$(find . -iname "main_scraper.py" | head -n 1)
          echo "Running: $SCRIP"
          python "$SCRIP"
