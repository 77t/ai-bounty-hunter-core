name: AI Bounty Hunter - Auto Scan

on:
  schedule:
    # Jalankan setiap 15 menit (Waktu UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan manual kapan saja

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "=== Checking current directory ==="
          pwd
          echo "=== Listing all files ==="
          ls -la
          echo "=== Installing requirements ==="
          pip install -r ./requirements.txt

      - name: Run Bounty Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== Searching for main_scraper.py ==="
          find . -name "main_scraper.py" -type f
          echo "=== Running script dynamically ==="
          SCRIPT_PATH=$(find . -name "main_scraper.py" -type f | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "ERROR: main_scraper.py not found!"
            exit 1
          fi
          python "$SCRIPT_PATH"
