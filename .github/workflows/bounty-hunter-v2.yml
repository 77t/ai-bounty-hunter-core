name: AI Bounty Hunter - Auto Scan

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pastikan checkout dilakukan ke root direktori
          path: '.'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug Environment & Find Files
        run: |
          echo "=== WORKSPACE STRUCTURE ==="
          pwd
          echo "--- Root Directory ---"
          ls -la
          echo "--- All Files (Recursive) ---"
          find . -type f -name "*.py" -o -name "*.txt" -o -name "*.yml" -o -name "*.yaml" | sort
          
          echo "=== SEARCHING FOR REQUIREMENTS.TXT ==="
          REQ_FILE=$(find . -iname "requirements.txt" -type f | head -n 1)
          if [ -z "$REQ_FILE" ]; then
            echo "FATAL ERROR: requirements.txt NOT FOUND anywhere!"
            exit 1
          else
            echo "Found requirements.txt at: $REQ_FILE"
          fi
          
          echo "=== SEARCHING FOR MAIN_SCRAPER.PY ==="
          SCRIPT_FILE=$(find . -iname "main_scraper.py" -type f | head -n 1)
          if [ -z "$SCRIPT_FILE" ]; then
            echo "FATAL ERROR: main_scraper.py NOT FOUND anywhere!"
            exit 1
          else
            echo "Found main_scraper.py at: $SCRIPT_FILE"
          fi

      - name: Install Dependencies
        run: |
          REQ_FILE=$(find . -iname "requirements.txt" -type f | head -n 1)
          echo "Installing from: $REQ_FILE"
          pip install -r "$REQ_FILE"

      - name: Run Bounty Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SCRIPT_FILE=$(find . -iname "main_scraper.py" -type f | head -n 1)
          echo "Running script from: $SCRIPT_FILE"
          python "$SCRIPT_FILE"
