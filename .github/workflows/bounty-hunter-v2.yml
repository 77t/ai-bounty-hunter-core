name: AI Bounty Hunter - Auto Scan

on:
  schedule:
    # Jalankan setiap 15 menit (Waktu UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan manual kapan saja

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug & Install Dependencies
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== List All Files (Recursive) ==="
          find . -type f
          echo "=== Installing Requirements ==="
          REQ_FILE=$(find . -name "requirements.txt" -type f | head -n 1)
          if [ -z "$REQ_FILE" ]; then
            echo "ERROR: requirements.txt not found!"
            exit 1
          fi
          pip install -r "$REQ_FILE"

      - name: Run Bounty Hunter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "=== Finding main_scraper.py ==="
          SCRIPT_PATH=$(find . -name "main_scraper.py" -type f | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "ERROR: main_scraper.py not found!"
            exit 1
          fi
          echo "Running script from: $SCRIPT_PATH"
          python "$SCRIPT_PATH"
