<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teguh Hunter - AI Orchestration Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Custom UI Enhancements */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #00AA13; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 170, 19, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        
        .tab-active {
            background-color: #00AA13 !important;
            color: white !important;
            font-weight: bold;
            border-color: transparent !important;
            box-shadow: 0 4px 12px rgba(0, 170, 19, 0.3);
        }
        
        .btn-gojek {
            background: linear-gradient(135deg, #00AA13 0%, #008a0f 100%);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gojek:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 170, 19, 0.4); }
        .btn-gojek:active { transform: scale(0.98); }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .badge-ready { background: #e6f7e6; color: #00AA13; border: 1px solid #b7eb8f; }
        .badge-auto { background: #fffbe6; color: #d48806; border: 1px solid #ffe58f; animation: pulse-yellow 2s infinite; }
        .badge-blocked { background: #fff1f0; color: #cf1322; border: 1px solid #ffa39e; }
        .badge-processing { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }

        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(0, 170, 19, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 170, 19, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 170, 19, 0); } }
        @keyframes pulse-yellow { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .live-indicator { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-24">

    <!-- HEADER COMMANDER -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-green-100 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#00AA13] rounded-xl flex items-center justify-center text-white font-bold text-xl live-indicator shadow-lg shadow-green-200">T</div>
            <div>
                <h1 class="font-extrabold text-lg leading-tight text-[#00AA13] tracking-tight">TEGUH HUNTER</h1>
                <p class="text-[10px] text-gray-500 font-medium">AI Orchestration & Auto-Execution Core v3.0</p>
            </div>
        </div>
        <div class="text-right">
            <div id="connection-status" class="text-[10px] font-mono text-gray-400 mb-0.5">Initializing...</div>
            <div id="last-update" class="text-[9px] text-gray-400">--:--</div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="sticky top-[72px] z-40 bg-white border-b border-gray-100 overflow-x-auto whitespace-nowrap px-3 py-3 shadow-sm scrollbar-hide">
        <div class="inline-flex gap-2 min-w-max">
            <button onclick="switchTab('uang')" id="tab-uang" class="tab-btn px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600 flex items-center gap-1.5 hover:bg-green-50 transition-all"> Uang & Crypto</button>
            <button onclick="switchTab('bug')" id="tab-bug" class="tab-btn px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600 flex items-center gap-1.5 hover:bg-green-50 transition-all">️ Bug Bounty</button>
            <button onclick="switchTab('barang')" id="tab-barang" class="tab-btn tab-active px-4 py-2 rounded-full text-xs border border-transparent flex items-center gap-1.5 transition-all">📦 Barang & Diskon</button>
            <button onclick="switchTab('kontrol')" id="tab-kontrol" class="tab-btn px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600 flex items-center gap-1.5 hover:bg-green-50 transition-all">️ Kontrol & Logs</button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="p-4 max-w-4xl mx-auto space-y-5">
        
        <!-- DASHBOARD SUMMARY CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-[#00AA13]">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Total Potensi</p>
                <h3 id="stat-potential" class="text-xl font-black text-gray-800 mt-1">Rp 0</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-blue-500">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Auto-Executed</p>
                <h3 id="stat-auto" class="text-xl font-black text-gray-800 mt-1">0</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-orange-500">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Pending Action</p>
                <h3 id="stat-pending" class="text-xl font-black text-gray-800 mt-1">0</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-purple-500">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Wallet Settled</p>
                <h3 id="stat-wallet" class="text-xl font-black text-gray-800 mt-1">Rp 0</h3>
            </div>
        </div>

        <!-- DATA CONTAINER -->
        <div id="data-container" class="space-y-4 min-h-[300px]">
            <!-- Loading Skeleton -->
            <div class="animate-pulse space-y-4">
                <div class="h-48 bg-gray-200 rounded-2xl"></div>
                <div class="h-48 bg-gray-200 rounded-2xl"></div>
                <div class="h-48 bg-gray-200 rounded-2xl"></div>
            </div>
        </div>

    </main>

    <!-- AUTO EXECUTE LOG MODAL -->
    <div id="log-modal" class="fixed bottom-4 right-4 w-80 bg-black/95 text-green-400 p-4 rounded-xl text-[10px] font-mono hidden z-50 shadow-2xl border border-green-500/30 backdrop-blur-xl">
        <div class="flex justify-between items-center mb-2 border-b border-green-500/20 pb-2">
            <span class="font-bold text-xs">🤖 AI AUTO-EXECUTOR LOG</span>
            <button onclick="document.getElementById('log-modal').classList.add('hidden')" class="text-gray-400 hover:text-white text-lg leading-none">×</button>
        </div>
        <div id="log-content" class="h-48 overflow-y-auto space-y-1.5 pr-2"></div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI SUPABASE (WAJIB DIISI BOS!)
        // ==========================================
        const SUPABASE_URL = "https://xnpxiddpfqolfqchtadw.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_pub1shable_muxzmf57Ec9OPmLuM-kHw_h65thgMQ"; 
        
        // Nama table sesuai konsep orkestrasi AI
        const TABLE_NAME = "bounties"; 

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentTab = 'barang';
        let allData = [];
        let autoExecInterval = null;

        // ==========================================
        // 2. FUNGSI UTAMA: SYNC DATA DARI GUDANG AI
        // ==========================================
        async function fetchLiveData() {
            const statusEl = document.getElementById('connection-status');
            try {
                statusEl.innerText = "Syncing with AI Database...";
                statusEl.className = "text-[10px] font-mono text-yellow-600 animate-pulse font-bold";

                const { data, error } = await supabase
                    .from(TABLE_NAME) 
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allData = data || [];
                updateStats(allData);
                renderTab(currentTab);

                statusEl.innerText = "● Connected Live";
                statusEl.className = "text-[10px] font-mono text-[#00AA13] font-bold";
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error("Supabase Error:", err);
                statusEl.innerText = "⚠ Connection Failed";
                statusEl.className = "text-[10px] font-mono text-red-500 font-bold";
                
                document.getElementById('data-container').innerHTML = `
                    <div class="p-8 bg-red-50 border border-red-200 rounded-2xl text-center shadow-sm">
                        <p class="text-red-600 font-bold text-lg mb-2">Gagal Mengambil Data AI</p>
                        <p class="text-xs text-red-500 font-mono break-all bg-red-100 p-2 rounded">${err.message}</p>
                        <p class="text-[10px] text-gray-500 mt-3">Pastikan Table '${TABLE_NAME}' ada & Credential Supabase benar.</p>
                    </div>
                `;
            }
        }

        // ==========================================
        // 3. RENDERING ENGINE (ORKESTRASI VISUAL)
        // ==========================================
        function renderTab(tabName) {
            currentTab = tabName;
            
            // Update Tombol Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            if(activeBtn) {
                activeBtn.classList.add('tab-active');
                activeBtn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
            }

            // Filter Data Berdasarkan Kategori
            const filteredData = allData.filter(item => {
                const cat = (item.category || item.type || '').toLowerCase();
                if (tabName === 'uang') return cat.includes('crypto') || cat.includes('airdrop') || cat.includes('reward') || cat.includes('uang');
                if (tabName === 'bug') return cat.includes('bug') || cat.includes('bounty') || cat.includes('vuln');
                if (tabName === 'barang') return cat.includes('barang') || cat.includes('diskon') || cat.includes('flashsale') || cat.includes('product');
                if (tabName === 'kontrol') return true;
                return true;
            });

            const container = document.getElementById('data-container');
            
            if (filteredData.length === 0 && allData.length > 0) {
                container.innerHTML = `
                    <div class="p-10 text-center bg-white rounded-2xl border border-dashed border-gray-300 shadow-sm">
                        <p class="text-gray-400 text-base font-medium">📭 Belum ada data untuk kategori "${tabName.toUpperCase()}"</p>
                        <p class="text-xs text-gray-300 mt-1">AI Agent sedang fokus mencari target lain...</p>
                    </div>
                `;
                return;
            } else if (allData.length === 0) {
                return; 
            }

            // Generate HTML Cards
            let html = '';
            filteredData.forEach(item => {
                const isAuto = item.auto_execute === true || item.status === 'auto_claim_ready';
                const isProcessing = item.status === 'processing' || item.status === 'executing';
                
                let badgeClass = 'badge-ready';
                let badgeText = 'MANUAL CHECK';
                
                if (isAuto) { badgeClass = 'badge-auto'; badgeText = 'AUTO-READY'; }
                else if (isProcessing) { badgeClass = 'badge-processing'; badgeText = 'AI PROCESSING'; }
                else if (item.status === 'blocked') { badgeClass = 'badge-blocked'; badgeText = 'BLOCKED'; }
                else if (item.status === 'completed') { badgeClass = 'badge-ready'; badgeText = 'COMPLETED'; }
                
                let btnText = "LIHAT DETAIL & SOLUSI";
                let btnIcon = "👁️";
                if (tabName === 'barang') { btnText = "AUTOFILL CHECKOUT"; btnIcon = ""; }
                if (tabName === 'uang') { btnText = "INSTANT HYBRID CLAIM"; btnIcon = "⚡"; }
                if (tabName === 'bug') { btnText = "COPY REPORT TEMPLATE"; btnIcon = "📋"; }
                if (isProcessing) { btnText = "WAITING FOR AI..."; btnIcon = "⏳"; }

                html += `
                <article class="glass-panel p-5 rounded-2xl relative overflow-hidden group hover:shadow-xl transition-all duration-300 border-l-4 ${isAuto ? 'border-yellow-400' : (isProcessing ? 'border-blue-400' : 'border-[#00AA13]')}">
                    
                    <div class="flex justify-between items-start mb-3">
                        <span class="${badgeClass} status-badge">${badgeText}</span>
                        <span class="text-sm font-black text-[#00AA13]">${item.value || item.reward || 'Rp 0'}</span>
                    </div>

                    <h3 class="text-lg font-black text-gray-900 mb-2 leading-snug">${item.title || 'Untitled Target'}</h3>
                    
                    <p class="text-sm text-gray-600 mb-4 line-clamp-3">${item.description || item.ai_analysis || 'Tidak ada deskripsi dari AI.'}</p>

                    <div class="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100">
                        <p class="text-[9px] uppercase text-gray-400 font-bold mb-1 tracking-wider">🧠 AI Solution / Steps:</p>
                        <p class="text-xs text-gray-700 font-mono whitespace-pre-wrap leading-relaxed">${item.solution || item.reproduction_steps || 'Menunggu analisis lebih lanjut...'}</p>
                    </div>

                    <div class="flex items-center gap-3 text-[10px] text-gray-400 mb-4 border-t border-gray-100 pt-3">
                        <span class="flex items-center gap-1">🎯 ${item.target_name || item.project || 'Unknown Project'}</span>
                        <span class="flex items-center gap-1">⏳ ${item.time_remaining || item.deadline || 'No deadline'}</span>
                        <span class="flex items-center gap-1">📦 ${item.stock || 'Unlimited'}</span>
                    </div>

                    <button onclick="handleAction('${item.id}', '${item.target_url || '#'}', '${tabName}')" 
                            class="btn-gojek w-full py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-md shadow-green-200 ${isProcessing ? 'opacity-50 cursor-not-allowed' : ''}"
                            ${isProcessing ? 'disabled' : ''}>
                        <span>${btnIcon}</span> ${btnText}
                    </button>
                </article>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 4. LOGIKA EKSEKUSI (HYBRID: MANUAL & AUTO)
        // ==========================================
        function handleAction(id, url, type) {
            if (!url || url === '#') {
                alert("⚠️ AI belum menemukan URL target valid untuk item ini.");
                return;
            }

            if (type === 'bug') {
                const item = allData.find(d => d.id === id);
                const reportText = `BUG REPORT: ${item.title}\n\nSEVERITY: ${item.severity || 'Medium'}\n\nDESCRIPTION:\n${item.description}\n\nSTEPS TO REPRODUCE:\n${item.solution}\n\nIMPACT:\n${item.impact || 'Potential data leak'}`;
                navigator.clipboard.writeText(reportText).then(() => {
                    alert("✅ Laporan bug berhasil disalin! Silakan paste ke platform bounty.");
                });
            } else {
                window.open(url, '_blank');
            }
        }

        // Auto Executor Engine (Jalan tiap 5 menit)
        function startAutoExecutor() {
            addLog(" AI Auto-Executor initialized. Scanning for 'auto_claim_ready' targets...");
            executeAutoClaims();
            autoExecInterval = setInterval(executeAutoClaims, 300000); // 5 menit
        }

        async function executeAutoClaims() {
            const autoTargets = allData.filter(item => item.auto_execute === true || item.status === 'auto_claim_ready');
            
            if (autoTargets.length === 0) {
                addLog("💤 No auto-ready targets found. Sleeping until next scan.");
                return;
            }

            addLog(` Found ${autoTargets.length} auto-ready targets. Executing parallel claims...`);

            for (const target of autoTargets) {
                try {
                    addLog(`▶ Executing: ${target.title}...`);
                    
                    // TODO: Di sini nanti masukkan logika call API ke backend executor Bos
                    // await fetch('/api/auto-claim', { method: 'POST', body: JSON.stringify(target) });
                    
                    // Simulasi sukses untuk demo
                    target.status = 'executed_by_ai';
                    addLog(`✅ SUCCESS: ${target.title} claimed via AI Agent.`);
                    
                } catch (err) {
                    addLog(`❌ FAILED: ${target.title} - ${err.message}`);
                }
            }
            
            renderTab(currentTab);
            updateStats(allData);
        }

        function addLog(message) {
            const logModal = document.getElementById('log-modal');
            const logContent = document.getElementById('log-content');
            const time = new Date().toLocaleTimeString();
            
            logContent.innerHTML = `<div class="border-l-2 border-green-500 pl-2"><span class="text-gray-500">[${time}]</span> ${message}</div>` + logContent.innerHTML;
            
            if (message.includes('Executing') || message.includes('SUCCESS')) {
                logModal.classList.remove('hidden');
                setTimeout(() => logModal.classList.add('hidden'), 5000);
            }
        }

        function updateStats(data) {
            const totalPotential = data.reduce((sum, item) => sum + (parseInt(String(item.value || '0').replace(/[^0-9]/g, '')) || 0), 0);
            const autoCount = data.filter(i => i.auto_execute || i.status === 'auto_claim_ready').length;
            const pendingCount = data.filter(i => !i.auto_execute && i.status !== 'blocked' && i.status !== 'completed').length;
            
            document.getElementById('stat-potential').innerText = `Rp ${totalPotential.toLocaleString('id-ID')}`;
            document.getElementById('stat-auto').innerText = autoCount;
            document.getElementById('stat-pending').innerText = pendingCount;
        }

        function switchTab(tab) {
            renderTab(tab);
        }

        // INITIALIZATION
        document.addEventListener('DOMContentLoaded', () => {
            fetchLiveData();
            startAutoExecutor();
            setInterval(fetchLiveData, 60000); // Refresh data tiap 1 menit
        });
    </script>
</body>
</html>
