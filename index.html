<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teguh Hunter - Stable Gold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
    
    <style>
        .glass-panel { background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .tab-active { background: #0066cc !important; color: white !important; font-weight: bold; border-color: transparent !important; }
        .btn-primary { background: #0066cc; color: white; border-radius: 12px; font-weight: bold; padding: 12px; width: 100%; transition: 0.2s; }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        
        /* Badge Styles */
        .badge-critical { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-high { background: #ffedd5; color: #ea580c; border: 1px solid #fed7aa; }
        .badge-normal { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .loading-pulse { animation: pulse 1.5s infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-20">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#0066cc] rounded-lg flex items-center justify-center text-white font-bold text-xl">T</div>
            <div>
                <h1 class="font-bold text-lg text-[#0066cc]">TEGUH HUNTER</h1>
                <p class="text-[10px] text-gray-500">Stable Gold Edition</p>
            </div>
        </div>
        <div class="text-right">
            <div id="status" class="text-[10px] font-mono text-gray-400">Connecting...</div>
        </div>
    </header>

    <!-- TABS -->
    <nav class="sticky top-[65px] z-40 bg-white border-b border-gray-100 overflow-x-auto whitespace-nowrap px-3 py-3 shadow-sm">
        <div class="inline-flex gap-2">
            <button onclick="switchTab('uang')" id="tab-uang" class="px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600">💰 Uang</button>
            <button onclick="switchTab('bug')" id="tab-bug" class="px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600">🛡️ Bug</button>
            <button onclick="switchTab('barang')" id="tab-barang" class="px-4 py-2 rounded-full text-xs border border-transparent tab-active">📦 Barang</button>
        </div>
    </nav>

    <!-- STATS -->
    <div class="p-4 grid grid-cols-2 gap-3">
        <div class="glass-panel p-3 border-l-4 border-[#0066cc]">
            <p class="text-[10px] text-gray-500 font-bold">TOTAL POTENSI</p>
            <h3 id="stat-potential" class="text-lg font-black">---</h3>
        </div>
        <div class="glass-panel p-3 border-l-4 border-red-500">
            <p class="text-[10px] text-gray-500 font-bold">CRITICAL BUGS</p>
            <h3 id="stat-critical" class="text-lg font-black text-red-600">---</h3>
        </div>
    </div>

    <!-- CONTENT -->
    <div id="content" class="p-4 space-y-4 min-h-[300px]">
        <div class="glass-panel p-8 text-center text-gray-400 loading-pulse">Memuat data emas...</div>
    </div>

    <script>
        // KONFIGURASI
        const SUPABASE_URL = "https://xnpxiddpfqolfqchtadw.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_muxzmfs57Ec9OPmLuM-kHw_h65thgMQ"; 
        
        let supabase = null;
        let allData = [];
        let currentTab = 'barang';

        // INIT
        window.onload = async function() {
            try {
                if (typeof window.supabase === 'undefined') throw new Error("Library Supabase gagal dimuat.");
                
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                document.getElementById('status').innerText = "Fetching Data...";
                
                const { data, error } = await supabase.from('bounties').select('*').order('created_at', { ascending: false });
                
                if (error) throw error;
                
                allData = data || [];
                updateStats();
                renderContent();
                
                document.getElementById('status').innerText = "● Live Connected";
                document.getElementById('status').className = "text-[10px] font-mono text-green-600 font-bold";
                
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "⚠ Error: " + err.message;
                document.getElementById('content').innerHTML = `
                    <div class="glass-panel p-6 text-center border border-red-200 bg-red-50">
                        <p class="text-red-600 font-bold mb-2">Gagal Mengambil Data</p>
                        <p class="text-xs text-red-500 mb-4">${err.message}</p>
                        <button onclick="window.location.reload()" class="px-4 py-2 bg-red-600 text-white rounded-lg text-xs font-bold">RETRY</button>
                    </div>
                `;
            }
        };

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('tab-active');
                b.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
            });
            const activeBtn = document.getElementById('tab-' + tab);
            activeBtn.classList.add('tab-active');
            activeBtn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
            renderContent();
        }

        function renderContent() {
            const container = document.getElementById('content');
            
            // Filter Data
            const filtered = allData.filter(item => {
                const prog = (item.program || '').toLowerCase();
                const analysis = JSON.stringify(item.ai_analysis || {}).toLowerCase();
                const title = (item.title || '').toLowerCase();
                
                if (currentTab === 'uang') return prog.includes('crypto') || prog.includes('finance') || analysis.includes('giveaway') || title.includes('cashback');
                if (currentTab === 'bug') return prog.includes('hackerone') || prog.includes('stripe') || analysis.includes('xss') || analysis.includes('rce') || analysis.includes('vulnerability');
                if (currentTab === 'barang') return prog.includes('shopee') || prog.includes('tokopedia') || prog.includes('electronics') || title.includes('flash sale');
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="glass-panel p-8 text-center text-gray-400">📭 Tidak ada data untuk kategori ini.</div>';
                return;
            }

            let html = '';
            filtered.forEach(item => {
                // Tentukan Badge
                let badgeClass = 'badge-normal';
                let riskText = 'NORMAL';
                
                if (item.ai_analysis) {
                    try {
                        const a = typeof item.ai_analysis === 'string' ? JSON.parse(item.ai_analysis) : item.ai_analysis;
                        const r = (a.risk_level || a.urgency || a.severity || '').toLowerCase();
                        
                        if (r.includes('crit')) { badgeClass = 'badge-critical'; riskText = 'CRITICAL'; }
                        else if (r.includes('high')) { badgeClass = 'badge-high'; riskText = 'HIGH'; }
                    } catch(e) {}
                }

                // Tentukan Deskripsi
                let desc = "AI Agent mendeteksi peluang menarik.";
                if (item.ai_analysis) {
                    try {
                        const a = typeof item.ai_analysis === 'string' ? JSON.parse(item.ai_analysis) : item.ai_analysis;
                        if (a.impact) desc = "Dampak: " + a.impact + ". Reproducible: " + (a.reproducible ? "Ya" : "Tidak");
                        else if (a.min_transaction) desc = "Min. Transaksi: Rp " + parseInt(a.min_transaction).toLocaleString('id-ID');
                        else if (a.requirement) desc = "Syarat: " + a.requirement;
                    } catch(e) {}
                }

                // Tombol Action
                let btnText = "LIHAT DETAIL";
                let btnAction = `window.open('${item.target_url || '#'}', '_blank')`;
                
                if (currentTab === 'bug') {
                    btnText = "COPY REPORT";
                    btnAction = `copyReport('${item.id}')`;
                } else if (currentTab === 'uang') {
                    btnText = "KLAIM REWARD";
                }

                html += `
                <div class="glass-panel p-4 border-l-4 ${badgeClass === 'badge-critical' ? 'border-red-500' : badgeClass === 'badge-high' ? 'border-orange-500' : 'border-[#0066cc]'}">
                    <div class="flex justify-between items-start mb-2">
                        <span class="${badgeClass} text-[10px] font-bold px-2 py-1 rounded-full uppercase">${riskText}</span>
                        <span class="font-bold text-[#0066cc]">${item.reward || 'Rp 0'}</span>
                    </div>
                    <h3 class="font-bold text-gray-900 mb-1">${item.title || item.program || 'Untitled'}</h3>
                    <p class="text-xs text-gray-600 mb-3 leading-relaxed">${desc}</p>
                    
                    <div class="bg-gray-50 p-2 rounded-lg mb-3 border border-gray-100">
                        <p class="text-[9px] text-gray-400 font-bold mb-1">AI ANALYSIS:</p>
                        <pre class="text-[10px] text-gray-600 font-mono whitespace-pre-wrap max-h-20 overflow-y-auto">${JSON.stringify(item.ai_analysis, null, 2)}</pre>
                    </div>

                    <div class="flex items-center gap-2 text-[10px] text-gray-400 mb-3">
                        <span>🎯 ${item.program || 'Unknown'}</span>
                        <span>📅 ${new Date(item.created_at).toLocaleDateString()}</span>
                    </div>

                    <button onclick="${btnAction}" class="btn-primary text-xs">${btnText}</button>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        function copyReport(id) {
            const item = allData.find(d => d.id === id);
            if (!item) return;
            const text = `BUG REPORT: ${item.title}\nPROGRAM: ${item.program}\nANALYSIS: ${JSON.stringify(item.ai_analysis)}\nURL: ${item.target_url}`;
            navigator.clipboard.writeText(text).then(() => alert("✅ Laporan disalin!"));
        }

        function updateStats() {
            const total = allData.reduce((sum, i) => sum + (parseInt(String(i.reward||'0').replace(/[^0-9]/g,'')) || 0), 0);
            const crit = allData.filter(i => {
                if (!i.ai_analysis) return false;
                const a = typeof i.ai_analysis === 'string' ? JSON.parse(i.ai_analysis) : i.ai_analysis;
                const r = (a.risk_level || a.urgency || '').toLowerCase();
                return r.includes('crit') || r.includes('high');
            }).length;
            
            document.getElementById('stat-potential').innerText = "Rp " + total.toLocaleString('id-ID');
            document.getElementById('stat-critical').innerText = crit;
        }
    </script>
</body>
</html>
