<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teguh Hunter Web APK - Stable Gold Edition</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>

    <style>
        /* Gojek Emerald Theme Configuration */
        :root { --emerald: #00AA13; --emerald-dark: #008f10; --emerald-light: #e6f7e8; }
        
        body { background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Luxury Mobile Tabs */
        .tab-btn { transition: all 0.3s ease; border-bottom: 3px solid transparent; color: #64748b; font-weight: 600; padding-bottom: 12px; }
        .tab-btn.active { color: var(--emerald); border-bottom-color: var(--emerald); }
        
        /* Triple Layer Card Styling */
        .card-layer { border-left: 4px solid var(--emerald); background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 16px; overflow: hidden; }
        .layer-header { padding: 16px; border-bottom: 1px dashed #e2e8f0; }
        .layer-body { padding: 16px; background: #fafafa; }
        .layer-footer { padding: 16px; background: white; border-top: 1px solid #f1f5f9; }
        
        /* Price Guard Alert Box */
        .price-guard { display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 12px; align-items: center; gap: 8px; }
        .price-guard.visible { display: flex; animation: shake 0.5s; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        /* Action Button */
        .btn-emerald { background: var(--emerald); color: white; font-weight: bold; border-radius: 12px; padding: 14px; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-emerald:active { transform: scale(0.98); background: var(--emerald-dark); }
        .btn-frozen { background: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; pointer-events: none; }
        
        /* Hide Raw JSON Braces */
        pre { white-space: pre-wrap; word-wrap: break-word; font-family: monospace; font-size: 11px; color: #475569; background: #f1f5f9; padding: 10px; border-radius: 8px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER REBRANDING -->
    <header class="sticky top-0 z-50 bg-white shadow-sm px-4 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[var(--emerald)] flex items-center justify-center text-white font-black text-xl shadow-lg shadow-green-200">T</div>
            <div>
                <h1 class="text-lg font-black text-gray-900 tracking-tight leading-none">TEGUH HUNTER WEB APK</h1>
                <p class="text-[10px] font-bold text-[var(--emerald)] uppercase tracking-wider mt-1">Stable Gold Edition</p>
            </div>
        </div>
        <div id="connection-status" class="text-[10px] font-mono text-gray-400">Connecting...</div>
    </header>

    <!-- 4-TAB SPA NAVIGATION -->
    <nav class="sticky top-[68px] z-40 bg-white border-b border-gray-100 overflow-x-auto whitespace-nowrap px-2 scrollbar-hide">
        <div class="flex min-w-max">
            <button onclick="switchTab('crypto')" id="tab-crypto" class="tab-btn active px-5 text-sm flex items-center gap-2"> Crypto & Airdrop</button>
            <button onclick="switchTab('tester')" id="tab-tester" class="tab-btn px-5 text-sm flex items-center gap-2">🧪 Free Tester</button>
            <button onclick="switchTab('bug')" id="tab-bug" class="tab-btn px-5 text-sm flex items-center gap-2">🛡️ Bug Bounty</button>
            <button onclick="switchTab('logs')" id="tab-logs" class="tab-btn px-5 text-sm flex items-center gap-2"> Logs & Stats</button>
        </div>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main id="content-area" class="p-4 space-y-4 min-h-[50vh]">
        <div class="animate-pulse space-y-4 mt-8">
            <div class="h-48 bg-gray-200 rounded-2xl"></div>
            <div class="h-48 bg-gray-200 rounded-2xl"></div>
        </div>
    </main>

    <script>
        // ==========================================
        // SUPABASE CONFIGURATION (PRODUCTION)
        // ==========================================
        const SUPABASE_URL = "https://xnpxiddpfqolfqchtadw.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_muxzmfs57Ec9OPmLuM-kHw_h65thgMQ"; 
        
        let supabaseClient = null;
        let currentTab = 'crypto';
        let liveData = [];

        // ==========================================
        // INITIALIZATION & DATA FETCHING
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                if (typeof window.supabase === 'undefined') throw new Error("Supabase Library gagal dimuat");
                
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                document.getElementById('connection-status').innerText = "Syncing...";
                
                const { data, error } = await supabaseClient
                    .from('bounties')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                liveData = data || [];
                renderCards();
                
                document.getElementById('connection-status').innerText = "● Live Connected";
                document.getElementById('connection-status').className = "text-[10px] font-mono text-[var(--emerald)] font-bold";
                
            } catch (err) {
                document.getElementById('connection-status').innerText = "⚠ Offline";
                document.getElementById('content-area').innerHTML = `
                    <div class="p-6 bg-red-50 border border-red-200 rounded-2xl text-center mt-8">
                        <p class="text-red-600 font-bold mb-2">Gagal Terhubung ke Database</p>
                        <p class="text-xs text-red-500 font-mono">${err.message}</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg text-xs font-bold">RETRY</button>
                    </div>`;
            }
        });

        // ==========================================
        // TAB SWITCHING LOGIC
        // ==========================================
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            renderCards();
        }

        // ==========================================
        // TRIPLE-LAYER CARD RENDERING ENGINE
        // ==========================================
        function renderCards() {
            const container = document.getElementById('content-area');
            
            // Filter Data Berdasarkan Tab
            const filtered = liveData.filter(item => {
                const cat = (item.category || '').toLowerCase();
                const prog = (item.program || '').toLowerCase();
                const analysis = JSON.stringify(item.ai_analysis || {}).toLowerCase();
                
                if (currentTab === 'crypto') return cat.includes('crypto') || cat.includes('airdrop') || prog.includes('coin');
                if (currentTab === 'tester') return cat.includes('tester') || cat.includes('sample') || prog.includes('beauty');
                if (currentTab === 'bug') return cat.includes('security') || prog.includes('hackerone') || analysis.includes('xss') || analysis.includes('rce');
                if (currentTab === 'logs') return true; // Tampilkan semua di logs
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-10 text-center bg-white rounded-2xl border border-dashed border-gray-300 mt-8"><p class="text-gray-400 font-medium">📭 Belum ada data untuk "${currentTab.toUpperCase()}"</p></div>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                // Parse AI Analysis JSONB
                const ai = typeof item.ai_analysis === 'string' ? JSON.parse(item.ai_analysis) : (item.ai_analysis || {});
                const riskLevel = ai.risk_level || 'Unknown';
                const eligibility = ai.eligibility || 'Check Details';
                const steps = Array.isArray(ai.step_by_step_guide) ? ai.step_by_step_guide : ['Instruksi belum tersedia.'];
                
                // Risk Color Mapping
                let riskColor = 'bg-blue-100 text-blue-700';
                if(riskLevel.toLowerCase().includes('high')) riskColor = 'bg-red-100 text-red-700';
                if(riskLevel.toLowerCase().includes('medium')) riskColor = 'bg-orange-100 text-orange-700';
                if(riskLevel.toLowerCase().includes('low')) riskColor = 'bg-green-100 text-green-700';

                // Generate Unique ID for Price Guard
                const cardId = `card-${item.id}`;
                const originalReward = item.reward || 'Free';

                html += `
                <article class="card-layer" id="${cardId}">
                    
                    <!-- 📋 LAYER 1: DATA RIIL -->
                    <div class="layer-header">
                        <div class="flex justify-between items-start mb-2">
                            <span class="${riskColor} text-[10px] font-black px-2 py-1 rounded-md uppercase tracking-wide">${riskLevel} RISK</span>
                            <span class="text-[var(--emerald)] font-black text-lg">${originalReward}</span>
                        </div>
                        <h3 class="font-black text-gray-900 text-base leading-snug mb-1">${item.title || 'Untitled Opportunity'}</h3>
                        <p class="text-[10px] text-gray-500 font-medium flex items-center gap-1">
                            🎯 ${item.program || 'Unknown Platform'} •  ${new Date(item.created_at).toLocaleDateString()}
                        </p>
                    </div>

                    <!-- ⚖️ LAYER 2: SYARAT & PROTEKSI -->
                    <div class="layer-body">
                        <div class="price-guard" id="guard-${item.id}">
                            ⚠️ <strong>PRICE GUARD ALERT:</strong> Nilai checkout berubah! Tombol dibekukan demi keamanan finansial Bos.
                        </div>
                        
                        <div class="space-y-2 text-xs text-gray-700">
                            <div class="flex items-start gap-2">
                                <span class="text-[var(--emerald)] mt-0.5">✓</span>
                                <span><strong>Kelayakan:</strong> ${eligibility}</span>
                            </div>
                            <div class="flex items-start gap-2">
                                <span class="text-[var(--emerald)] mt-0.5">✓</span>
                                <span><strong>Tingkat Risiko:</strong> ${riskLevel} (Verified by AI)</span>
                            </div>
                        </div>
                    </div>

                    <!-- 🛠️ LAYER 3: PETUNJUK EKSEKUSI -->
                    <div class="layer-footer">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">🛠️ Petunjuk Eksekusi Mobile:</p>
                        <ol class="list-decimal list-inside text-xs text-gray-600 space-y-1 mb-4 pl-1">
                            ${steps.map(step => `<li>${step.replace(/^\d+\.\s*/, '')}</li>`).join('')}
                        </ol>

                        <!-- EMERALD ACTION PIPELINE -->
                        ${currentTab === 'bug' ? `
                            <button onclick="copyBugReport('${item.id}')" class="btn-emerald text-xs">
                                📄 COPY REPORT
                            </button>
                        ` : `
                            <button onclick="safeNavigate('${item.target_url}', '${cardId}', '${originalReward}')" class="btn-emerald text-xs" id="btn-${item.id}">
                                🚀 CLAIM / VISIT TARGET
                            </button>
                        `}
                    </div>
                </article>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // ACTION HANDLERS & PRICE GUARD PROTECTION
        // ==========================================
        
        // Price Guard Protection Logic
        function safeNavigate(url, cardId, originalReward) {
            if (!url || url === '#') {
                alert("⚠️ Target URL tidak valid atau belum tersedia.");
                return;
            }

            // Simulasi Price Guard: Cek apakah reward masih sama (bisa dikembangkan dengan fetch real-time price)
            // Di sini kita gunakan logika dasar: jika tombol diklik 2x dalam 1 detik, bekukan (anti-double spend)
            const btn = document.getElementById(`btn-${cardId.split('-')[1]}`);
            const guard = document.getElementById(`guard-${cardId.split('-')[1]}`);
            
            if (btn.dataset.clicked === 'true') {
                guard.classList.add('visible');
                btn.classList.add('btn-frozen');
                btn.innerHTML = "🔒 FROZEN (Price Guard Active)";
                return;
            }
            
            btn.dataset.clicked = 'true';
            setTimeout(() => { btn.dataset.clicked = 'false'; }, 2000); // Reset setelah 2 detik
            
            window.open(url, '_blank');
        }

        // Bug Bounty Copy Report Handler
        function copyBugReport(id) {
            const item = liveData.find(d => d.id === id);
            if (!item) return;
            
            const ai = typeof item.ai_analysis === 'string' ? JSON.parse(item.ai_analysis) : item.ai_analysis;
            const reportText = `SECURITY REPORT: ${item.title}\n\nPLATFORM: ${item.program}\nSEVERITY: ${ai?.risk_level || 'N/A'}\nELIGIBILITY: ${ai?.eligibility || 'N/A'}\n\nAI ANALYSIS:\n${JSON.stringify(ai, null, 2)}\n\nTARGET URL: ${item.target_url}\n\n[END OF REPORT]`;
            
            navigator.clipboard.writeText(reportText).then(() => {
                alert("✅ Laporan keamanan berhasil disalin ke clipboard!");
            }).catch(() => {
                alert("❌ Gagal menyalin. Silakan copy manual.");
            });
        }
    </script>
</body>
</html>
