<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teguh Hunter - AI Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Custom Scrollbar & Animations */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #00AA13; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 170, 19, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
        
        .tab-active {
            background-color: #00AA13 !important;
            color: white !important;
            font-weight: bold;
        }
        
        .btn-gojek {
            background-color: #00AA13;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gojek:hover { background-color: #008a0f; transform: translateY(-2px); }
        
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-ready { background: #e6f7e6; color: #00AA13; border: 1px solid #00AA13; }
        .badge-auto { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-blocked { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 170, 19, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 170, 19, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 170, 19, 0); }
        }
        .live-indicator { animation: pulse-green 2s infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-20">

    <!-- HEADER COMMANDER -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-green-100 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#00AA13] rounded-lg flex items-center justify-center text-white font-bold text-xl live-indicator">T</div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-[#00AA13]">TEGUH HUNTER</h1>
                <p class="text-xs text-gray-500">AI Hybrid Command Center v2.0</p>
            </div>
        </div>
        <div class="text-right">
            <div id="connection-status" class="text-xs font-mono text-gray-400">Connecting to Supabase...</div>
            <div id="last-update" class="text-[10px] text-gray-400">--:--</div>
        </div>
    </header>

    <!-- NAVIGATION TABS (GOJEK STYLE) -->
    <nav class="sticky top-[73px] z-40 bg-white border-b border-gray-100 overflow-x-auto whitespace-nowrap px-2 py-3 shadow-sm">
        <div class="inline-flex gap-2 min-w-max">
            <button onclick="switchTab('uang')" id="tab-uang" class="tab-btn px-5 py-2.5 rounded-full text-sm border border-gray-200 bg-white text-gray-600 flex items-center gap-2 hover:bg-green-50 transition-all">
                💰 Uang & Crypto
            </button>
            <button onclick="switchTab('bug')" id="tab-bug" class="tab-btn px-5 py-2.5 rounded-full text-sm border border-gray-200 bg-white text-gray-600 flex items-center gap-2 hover:bg-green-50 transition-all">
                🛡️ Bug Bounty
            </button>
            <button onclick="switchTab('barang')" id="tab-barang" class="tab-btn tab-active px-5 py-2.5 rounded-full text-sm border border-transparent flex items-center gap-2 transition-all">
                 Barang & Diskon
            </button>
            <button onclick="switchTab('kontrol')" id="tab-kontrol" class="tab-btn px-5 py-2.5 rounded-full text-sm border border-gray-200 bg-white text-gray-600 flex items-center gap-2 hover:bg-green-50 transition-all">
                ⚙️ Kontrol & Logs
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <main class="p-4 max-w-4xl mx-auto space-y-4">
        
        <!-- DASHBOARD SUMMARY CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-[#00AA13]">
                <p class="text-xs text-gray-500 uppercase tracking-wider">Total Potensi</p>
                <h3 id="stat-potential" class="text-2xl font-bold text-gray-800 mt-1">Rp 0</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-blue-500">
                <p class="text-xs text-gray-500 uppercase tracking-wider">Auto-Executed</p>
                <h3 id="stat-auto" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-orange-500">
                <p class="text-xs text-gray-500 uppercase tracking-wider">Pending Action</p>
                <h3 id="stat-pending" class="text-2xl font-bold text-gray-800 mt-1">0</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-purple-500">
                <p class="text-xs text-gray-500 uppercase tracking-wider">Wallet Settled</p>
                <h3 id="stat-wallet" class="text-2xl font-bold text-gray-800 mt-1">Rp 0</h3>
            </div>
        </div>

        <!-- DATA CONTAINER -->
        <div id="data-container" class="space-y-4">
            <!-- Loading Skeleton -->
            <div class="animate-pulse space-y-4">
                <div class="h-40 bg-gray-200 rounded-2xl"></div>
                <div class="h-40 bg-gray-200 rounded-2xl"></div>
                <div class="h-40 bg-gray-200 rounded-2xl"></div>
            </div>
        </div>

    </main>

    <!-- AUTO EXECUTE LOG MODAL (Hidden by default) -->
    <div id="log-modal" class="fixed bottom-4 right-4 w-80 bg-black/90 text-green-400 p-4 rounded-xl text-xs font-mono hidden z-50 shadow-2xl border border-green-500/30">
        <div class="flex justify-between items-center mb-2 border-b border-green-500/20 pb-2">
            <span class="font-bold">🤖 AI AUTO-EXECUTOR LOG</span>
            <button onclick="document.getElementById('log-modal').classList.add('hidden')" class="text-gray-400 hover:text-white">✕</button>
        </div>
        <div id="log-content" class="h-40 overflow-y-auto space-y-1">
            <!-- Logs will appear here -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. KONFIGURASI SUPABASE (PASTIKAN BENAR!)
        // ==========================================
        const SUPABASE_URL = "https://xnpxiddpfqolfqchtadw.supabase.co"; // Ganti dengan URL Supabase Bos
        const SUPABASE_ANON_KEY = "sb_pub1shable_muxzmf57Ec9OPmLuM-kHw_h65thgMQ"; // Ganti dengan Anon Key Bos
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // State Global
        let currentTab = 'barang';
        let allData = [];
        let autoExecInterval = null;

        // ==========================================
        // 2. FUNGSI UTAMA: AMBIL DATA LIVE DARI SUPABASE
        // ==========================================
        async function fetchLiveData() {
            const statusEl = document.getElementById('connection-status');
            try {
                statusEl.innerText = "Syncing with AI Database...";
                statusEl.className = "text-xs font-mono text-yellow-600 animate-pulse";

                // Ambil semua data dari table 'bounties' (atau nama table lain jika beda)
                const { data, error } = await supabase
                    .from('bounties') 
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allData = data || [];
                
                // Update UI Stats
                updateStats(allData);
                
                // Render Tab Aktif
                renderTab(currentTab);

                statusEl.innerText = "● Connected Live";
                statusEl.className = "text-xs font-mono text-[#00AA13] font-bold";
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error("Supabase Error:", err);
                statusEl.innerText = "⚠ Connection Failed";
                statusEl.className = "text-xs font-mono text-red-500";
                document.getElementById('data-container').innerHTML = `
                    <div class="p-6 bg-red-50 border border-red-200 rounded-2xl text-center">
                        <p class="text-red-600 font-bold">Gagal Mengambil Data AI</p>
                        <p class="text-sm text-red-500 mt-1">${err.message}</p>
                        <p class="text-xs text-gray-500 mt-2">Pastikan URL & Key Supabase benar di kode.</p>
                    </div>
                `;
            }
        }

        // ==========================================
        // 3. RENDERING ENGINE (MAPPING DATA KE UI HIJAU GOJEK)
        // ==========================================
        function renderTab(tabName) {
            currentTab = tabName;
            
            // Update Tombol Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            if(activeBtn) {
                activeBtn.classList.add('tab-active');
                activeBtn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
            }

            // Filter Data Berdasarkan Kategori
            // Asumsi kolom kategori di DB bernama 'category' atau 'type'
            const filteredData = allData.filter(item => {
                const cat = (item.category || item.type || '').toLowerCase();
                if (tabName === 'uang') return cat.includes('crypto') || cat.includes('airdrop') || cat.includes('reward');
                if (tabName === 'bug') return cat.includes('bug') || cat.includes('bounty') || cat.includes('vuln');
                if (tabName === 'barang') return cat.includes('barang') || cat.includes('diskon') || cat.includes('flashsale') || cat.includes('product');
                if (tabName === 'kontrol') return true; // Tampilkan semua di kontrol/logs
                return true;
            });

            const container = document.getElementById('data-container');
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center bg-white rounded-2xl border border-dashed border-gray-300">
                        <p class="text-gray-400 text-lg">📭 Belum ada data AI untuk kategori ini</p>
                        <p class="text-sm text-gray-300 mt-1">Agent sedang mencari target baru...</p>
                    </div>
                `;
                return;
            }

            // Generate HTML Cards
            let html = '';
            filteredData.forEach(item => {
                const isAuto = item.auto_execute === true || item.status === 'auto_claim_ready';
                const badgeClass = isAuto ? 'badge-auto' : (item.status === 'blocked' ? 'badge-blocked' : 'badge-ready');
                const badgeText = isAuto ? ' AUTO-READY' : (item.status || 'MANUAL CHECK');
                
                // Tentukan Text Tombol Berdasarkan Tipe
                let btnText = "LIHAT DETAIL & SOLUSI";
                let btnIcon = "👁️";
                if (tabName === 'barang') { btnText = "AUTOFILL CHECKOUT"; btnIcon = "🛒"; }
                if (tabName === 'uang') { btnText = "INSTANT HYBRID CLAIM"; btnIcon = "⚡"; }
                if (tabName === 'bug') { btnText = "COPY REPORT TEMPLATE"; btnIcon = "📋"; }

                html += `
                <article class="glass-panel p-5 rounded-2xl relative overflow-hidden group hover:shadow-lg transition-all duration-300 border-l-4 ${isAuto ? 'border-yellow-400' : 'border-[#00AA13]'}">
                    
                    <!-- Header Card -->
                    <div class="flex justify-between items-start mb-3">
                        <span class="${badgeClass} status-badge">${badgeText}</span>
                        <span class="text-sm font-bold text-[#00AA13]">${item.value || item.reward || 'Rp 0'}</span>
                    </div>

                    <!-- Judul Target -->
                    <h3 class="text-xl font-bold text-gray-900 mb-2 leading-snug">${item.title || 'Untitled Target'}</h3>
                    
                    <!-- Deskripsi Analisis AI -->
                    <p class="text-sm text-gray-600 mb-4 line-clamp-3">${item.description || item.ai_analysis || 'Tidak ada deskripsi dari AI.'}</p>

                    <!-- Detail Teknis / Solusi (Accordion Style Simple) -->
                    <div class="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100">
                        <p class="text-[10px] uppercase text-gray-400 font-bold mb-1">🧠 AI Solution / Steps:</p>
                        <p class="text-xs text-gray-700 font-mono whitespace-pre-wrap">${item.solution || item.reproduction_steps || 'Menunggu analisis lebih lanjut...'}</p>
                    </div>

                    <!-- Meta Info -->
                    <div class="flex items-center gap-4 text-xs text-gray-400 mb-4 border-t border-gray-100 pt-3">
                        <span>🎯 ${item.target_name || item.project || 'Unknown Project'}</span>
                        <span>️ ${item.time_remaining || item.deadline || 'No deadline'}</span>
                        <span>📦 Stock: ${item.stock || 'Unlimited'}</span>
                    </div>

                    <!-- Action Button -->
                    <button onclick="handleAction('${item.id}', '${item.target_url || '#'}', '${tabName}')" 
                            class="btn-gojek w-full py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-md shadow-green-200">
                        <span>${btnIcon}</span> ${btnText}
                    </button>
                </article>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // 4. LOGIKA EKSEKUSI (HYBRID: MANUAL & AUTO)
        // ==========================================
        function handleAction(id, url, type) {
            if (!url || url === '#') {
                alert("⚠️ AI belum menemukan URL target valid untuk item ini.");
                return;
            }

            if (type === 'bug') {
                // Copy Report Logic
                const item = allData.find(d => d.id === id);
                const reportText = `BUG REPORT: ${item.title}\n\nSEVERITY: ${item.severity || 'Medium'}\n\nDESCRIPTION:\n${item.description}\n\nSTEPS TO REPRODUCE:\n${item.solution}\n\nIMPACT:\n${item.impact || 'Potential data leak'}`;
                navigator.clipboard.writeText(reportText).then(() => {
                    alert("✅ Laporan bug berhasil disalin! Silakan paste ke platform bounty.");
                });
            } else {
                // Buka Link Checkout/Claim
                window.open(url, '_blank');
            }
        }

        // Auto Executor Engine (Jalan tiap 5 menit)
        function startAutoExecutor() {
            addLog("🚀 AI Auto-Executor initialized. Scanning for 'auto_claim_ready' targets...");
            
            // Jalankan sekali saat load
            executeAutoClaims();

            // Set interval 5 menit (300000 ms)
            autoExecInterval = setInterval(() => {
                executeAutoClaims();
            }, 300000); 
        }

        async function executeAutoClaims() {
            const autoTargets = allData.filter(item => item.auto_execute === true || item.status === 'auto_claim_ready');
            
            if (autoTargets.length === 0) {
                addLog("💤 No auto-ready targets found. Sleeping until next scan.");
                return;
            }

            addLog(`🔍 Found ${autoTargets.length} auto-ready targets. Executing parallel claims...`);

            // Simulasi Eksekusi Paralel (Di real world, ini panggil API backend/proxy)
            for (const target of autoTargets) {
                try {
                    addLog(` Executing: ${target.title}...`);
                    
                    // TODO: Di sini nanti masukkan logika call API ke backend executor Bos
                    // await fetch('/api/auto-claim', { method: 'POST', body: JSON.stringify(target) });
                    
                    // Update status di local state (nanti sync ke DB)
                    target.status = 'executed_by_ai';
                    addLog(`✅ SUCCESS: ${target.title} claimed via AI Agent.`);
                    
                } catch (err) {
                    addLog(`❌ FAILED: ${target.title} - ${err.message}`);
                }
            }
            
            // Refresh tampilan setelah eksekusi
            renderTab(currentTab);
            updateStats(allData);
        }

        function addLog(message) {
            const logModal = document.getElementById('log-modal');
            const logContent = document.getElementById('log-content');
            const time = new Date().toLocaleTimeString();
            
            logContent.innerHTML = `<div><span class="text-gray-500">[${time}]</span> ${message}</div>` + logContent.innerHTML;
            
            // Tampilkan modal log sebentar jika ada aksi penting
            if (message.includes('Executing') || message.includes('SUCCESS')) {
                logModal.classList.remove('hidden');
                setTimeout(() => logModal.classList.add('hidden'), 5000);
            }
        }

        function updateStats(data) {
            const totalPotential = data.reduce((sum, item) => sum + (parseInt(item.value?.replace(/[^0-9]/g, '')) || 0), 0);
            const autoCount = data.filter(i => i.auto_execute || i.status === 'auto_claim_ready').length;
            const pendingCount = data.filter(i => !i.auto_execute && i.status !== 'blocked').length;
            
            document.getElementById('stat-potential').innerText = `Rp ${totalPotential.toLocaleString('id-ID')}`;
            document.getElementById('stat-auto').innerText = autoCount;
            document.getElementById('stat-pending').innerText = pendingCount;
            // Wallet settled bisa diambil dari table terpisah 'claims' jika ada
        }

        function switchTab(tab) {
            renderTab(tab);
        }

        // ==========================================
        // 5. INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            fetchLiveData();
            startAutoExecutor();
            
            // Refresh data setiap 1 menit agar tetap fresh
            setInterval(fetchLiveData, 60000);
        });

    </script>
</body>
</html>
