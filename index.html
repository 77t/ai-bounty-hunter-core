<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teguh Hunter - Anti-Crash Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS (Dengan integrity check) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
    
    <style>
        /* Custom UI Enhancements */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0066cc; border-radius: 10px; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 102, 204, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        
        .tab-active {
            background-color: #0066cc !important;
            color: white !important;
            font-weight: bold;
            border-color: transparent !important;
            box-shadow: 0 4px 12px rgba(0, 102, 204, 0.3);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 102, 204, 0.4); }
        .btn-primary:active { transform: scale(0.98); }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .badge-critical { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .badge-high { background: #ffedd5; color: #ea580c; border: 1px solid #fed7aa; }
        .badge-normal { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }

        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(0, 102, 204, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(0, 102, 204, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 102, 204, 0); } }
        .live-indicator { animation: pulse-blue 2s infinite; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen pb-24">

    <!-- HEADER COMMANDER -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-blue-100 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#0066cc] rounded-xl flex items-center justify-center text-white font-bold text-xl live-indicator shadow-lg shadow-blue-200">T</div>
            <div>
                <h1 class="font-extrabold text-lg leading-tight text-[#0066cc] tracking-tight">TEGUH HUNTER</h1>
                <p class="text-[10px] text-gray-500 font-medium">Anti-Crash Edition • v3.0</p>
            </div>
        </div>
        <div class="text-right">
            <div id="connection-status" class="text-[10px] font-mono text-gray-400 mb-0.5">Checking System...</div>
            <div id="last-update" class="text-[9px] text-gray-400">--:--</div>
        </div>
    </header>

    <!-- NAVIGATION TABS -->
    <nav class="sticky top-[72px] z-40 bg-white border-b border-gray-100 overflow-x-auto whitespace-nowrap px-3 py-3 shadow-sm scrollbar-hide">
        <div class="inline-flex gap-2 min-w-max">
            <button onclick="switchTab('uang')" id="tab-uang" class="tab-btn px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600 flex items-center gap-1.5 hover:bg-blue-50 transition-all">💰 Uang & Crypto</button>
            <button onclick="switchTab('bug')" id="tab-bug" class="tab-btn px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600 flex items-center gap-1.5 hover:bg-blue-50 transition-all">🛡️ Bug Bounty</button>
            <button onclick="switchTab('barang')" id="tab-barang" class="tab-btn tab-active px-4 py-2 rounded-full text-xs border border-transparent flex items-center gap-1.5 transition-all"> Barang & Diskon</button>
            <button onclick="switchTab('kontrol')" id="tab-kontrol" class="tab-btn px-4 py-2 rounded-full text-xs border border-gray-200 bg-white text-gray-600 flex items-center gap-1.5 hover:bg-blue-50 transition-all">⚙️ Kontrol & Logs</button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="p-4 max-w-4xl mx-auto space-y-5">
        
        <!-- DASHBOARD SUMMARY CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-[#0066cc]">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Total Potensi</p>
                <h3 id="stat-potential" class="text-xl font-black text-gray-800 mt-1">---</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-green-500">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Bug Critical</p>
                <h3 id="stat-critical" class="text-xl font-black text-gray-800 mt-1">---</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-orange-500">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Flash Sales</p>
                <h3 id="stat-sales" class="text-xl font-black text-gray-800 mt-1">---</h3>
            </div>
            <div class="glass-panel p-4 rounded-2xl border-l-4 border-purple-500">
                <p class="text-[10px] text-gray-500 uppercase tracking-wider font-bold">Total Items</p>
                <h3 id="stat-total" class="text-xl font-black text-gray-800 mt-1">---</h3>
            </div>
        </div>

        <!-- DATA CONTAINER -->
        <div id="data-container" class="space-y-4 min-h-[300px]">
            <!-- Initial Loading State -->
            <div class="animate-pulse space-y-4">
                <div class="h-48 bg-gray-200 rounded-2xl"></div>
                <div class="h-48 bg-gray-200 rounded-2xl"></div>
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = "https://xnpxiddpfqolfqchtadw.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_pub1shable_muxzmf57Ec9OPmLuM-kHw_h65thgMQ"; 
        
        let supabaseClient = null;
        let currentTab = 'barang';
        let allData = [];

        // ==========================================
        // INITIALIZATION DENGAN ERROR CHECKING
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            const statusEl = document.getElementById('connection-status');
            
            try {
                // 1. Cek apakah library Supabase tersedia
                if (typeof window.supabase === 'undefined') {
                    throw new Error("Supabase Library NOT loaded from CDN!");
                }
                
                statusEl.innerText = "Initializing Client...";
                
                // 2. Buat client
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                if (!supabaseClient) {
                    throw new Error("Failed to create Supabase client instance.");
                }
                
                statusEl.innerText = "Fetching Data...";
                
                // 3. Ambil data
                await fetchLiveData();
                
            } catch (initError) {
                console.error("Initialization Error:", initError);
                statusEl.innerText = "⚠ Init Failed";
                statusEl.className = "text-[10px] font-mono text-red-500 font-bold";
                
                document.getElementById('data-container').innerHTML = `
                    <div class="p-8 bg-red-50 border border-red-200 rounded-2xl text-center shadow-sm">
                        <p class="text-red-600 font-bold text-lg mb-2">SISTEM GAGAL DIMULAI</p>
                        <p class="text-xs text-red-500 font-mono break-all bg-red-100 p-2 rounded">${initError.message}</p>
                        <p class="text-[10px] text-gray-500 mt-2">Cek koneksi internet atau buka Console Browser (F12) untuk detail.</p>
                        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg text-xs font-bold">RETRY</button>
                    </div>
                `;
                
                // Reset stats to show failure
                document.getElementById('stat-potential').innerText = "ERR";
                document.getElementById('stat-critical').innerText = "ERR";
                document.getElementById('stat-sales').innerText = "ERR";
                document.getElementById('stat-total').innerText = "ERR";
            }
        });

        // ==========================================
        // FUNGSI UTAMA: AMBIL DATA LIVE
        // ==========================================
        async function fetchLiveData() {
            const statusEl = document.getElementById('connection-status');
            
            if (!supabaseClient) {
                throw new Error("Supabase client not initialized");
            }

            try {
                statusEl.innerText = "Syncing Gold Data...";
                statusEl.className = "text-[10px] font-mono text-yellow-600 animate-pulse font-bold";

                const { data, error } = await supabaseClient
                    .from('bounties') 
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("Supabase Query Error:", error);
                    throw error;
                }

                allData = data || [];
                
                // Update UI
                updateStats(allData);
                renderTab(currentTab);

                statusEl.innerText = "● Live Connected";
                statusEl.className = "text-[10px] font-mono text-[#0066cc] font-bold";
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();

            } catch (err) {
                console.error("Fetch Data Error:", err);
                statusEl.innerText = "⚠ Data Fetch Failed";
                statusEl.className = "text-[10px] font-mono text-red-500 font-bold";
                
                document.getElementById('data-container').innerHTML = `
                    <div class="p-8 bg-orange-50 border border-orange-200 rounded-2xl text-center shadow-sm">
                        <p class="text-orange-600 font-bold text-lg mb-2">Gagal Mengambil Data</p>
                        <p class="text-xs text-orange-500 font-mono break-all bg-orange-100 p-2 rounded">${err.message}</p>
                        <p class="text-[10px] text-gray-500 mt-2">Pastikan table 'bounties' ada dan RLS policy mengizinkan akses anon.</p>
                        <button onclick="fetchLiveData()" class="mt-4 px-4 py-2 bg-orange-600 text-white rounded-lg text-xs font-bold">RETRY FETCH</button>
                    </div>
                `;
            }
        }

        // ==========================================
        // RENDERING ENGINE
        // ==========================================
        function renderTab(tabName) {
            currentTab = tabName;
            
            // Update Tombol Tab
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('bg-white', 'text-gray-600', 'border-gray-200');
            });
            const activeBtn = document.getElementById(`tab-${tabName}`);
            if(activeBtn) {
                activeBtn.classList.add('tab-active');
                activeBtn.classList.remove('bg-white', 'text-gray-600', 'border-gray-200');
            }

            // Filter Data
            const filteredData = allData.filter(item => {
                const prog = (item.program || '').toLowerCase();
                const analysis = item.ai_analysis ? JSON.stringify(item.ai_analysis).toLowerCase() : '';
                
                if (tabName === 'uang') return prog.includes('crypto') || prog.includes('finance') || analysis.includes('giveaway') || analysis.includes('airdrop');
                if (tabName === 'bug') return prog.includes('hackerone') || prog.includes('stripe') || analysis.includes('xss') || analysis.includes('vulnerability');
                if (tabName === 'barang') return prog.includes('shopee') || prog.includes('tokopedia') || prog.includes('electronics') || prog.includes('beauty');
                if (tabName === 'kontrol') return true;
                return true;
            });

            const container = document.getElementById('data-container');
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="p-10 text-center bg-white rounded-2xl border border-dashed border-gray-300 shadow-sm">
                        <p class="text-gray-400 text-base font-medium">📭 Belum ada data untuk "${tabName.toUpperCase()}"</p>
                        <p class="text-xs text-gray-300 mt-1">AI Agent sedang fokus mencari target lain...</p>
                    </div>
                `;
                return;
            }

            // Generate HTML Cards
            let html = '';
            filteredData.forEach(item => {
                // Parsing AI Analysis JSON
                let type = 'General';
                let risk = 'Normal';
                if (item.ai_analysis) {
                    try {
                        const analysis = typeof item.ai_analysis === 'string' ? JSON.parse(item.ai_analysis) : item.ai_analysis;
                        type = analysis.type || analysis.concept || 'General';
                        risk = analysis.risk_level || analysis.urgency || 'Normal';
                    } catch(e) {}
                }

                // Tentukan Badge Warna
                let badgeClass = 'badge-normal';
                if (risk === 'Critical' || risk === 'High') badgeClass = 'badge-critical';
                else if (risk === 'Medium') badgeClass = 'badge-high';

                // Tentukan Text Tombol
                let btnText = "LIHAT DETAIL";
                let btnIcon = "️";
                if (tabName === 'barang') { btnText = "CHECKOUT SEKARANG"; btnIcon = ""; }
                if (tabName === 'uang') { btnText = "KLAIM REWARD"; btnIcon = "⚡"; }
                if (tabName === 'bug') { btnText = "COPY REPORT"; btnIcon = "📋"; }

                html += `
                <article class="glass-panel p-5 rounded-2xl relative overflow-hidden group hover:shadow-xl transition-all duration-300 border-l-4 ${badgeClass === 'badge-critical' ? 'border-red-500' : 'border-[#0066cc]'}">
                    
                    <div class="flex justify-between items-start mb-3">
                        <span class="${badgeClass} status-badge">${risk.toUpperCase()}</span>
                        <span class="text-sm font-black text-[#0066cc]">${item.reward || 'Rp 0'}</span>
                    </div>

                    <h3 class="text-lg font-black text-gray-900 mb-2 leading-snug">${item.title || item.program || 'Untitled Target'}</h3>
                    
                    <p class="text-sm text-gray-600 mb-4 line-clamp-3">${item.description || type + ' detected by AI Agent.'}</p>

                    <div class="bg-gray-50 rounded-xl p-3 mb-4 border border-gray-100">
                        <p class="text-[9px] uppercase text-gray-400 font-bold mb-1 tracking-wider">🧠 AI Analysis:</p>
                        <p class="text-xs text-gray-700 font-mono whitespace-pre-wrap leading-relaxed">${JSON.stringify(item.ai_analysis, null, 2) || 'No detailed analysis available.'}</p>
                    </div>

                    <div class="flex items-center gap-3 text-[10px] text-gray-400 mb-4 border-t border-gray-100 pt-3">
                        <span class="flex items-center gap-1">🎯 ${item.program || 'Unknown Program'}</span>
                        <span class="flex items-center gap-1">📅 ${new Date(item.created_at).toLocaleDateString()}</span>
                    </div>

                    <button onclick="handleAction('${item.id}', '${item.target_url || '#'}', '${tabName}')" 
                            class="btn-primary w-full py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow-md shadow-blue-200">
                        <span>${btnIcon}</span> ${btnText}
                    </button>
                </article>
                `;
            });

            container.innerHTML = html;
        }

        // ==========================================
        // LOGIKA EKSEKUSI
        // ==========================================
        function handleAction(id, url, type) {
            if (!url || url === '#') {
                alert("️ AI belum menemukan URL target valid.");
                return;
            }

            if (type === 'bug') {
                const item = allData.find(d => d.id === id);
                const reportText = `BUG REPORT: ${item.title}\n\nPROGRAM: ${item.program}\n\nANALYSIS:\n${JSON.stringify(item.ai_analysis)}\n\nURL: ${url}`;
                navigator.clipboard.writeText(reportText).then(() => {
                    alert("✅ Laporan bug berhasil disalin!");
                });
            } else {
                window.open(url, '_blank');
            }
        }

        function updateStats(data) {
            const totalPotential = data.reduce((sum, item) => {
                const val = String(item.reward || '0').replace(/[^0-9]/g, '');
                return sum + (parseInt(val) || 0);
            }, 0);
            
            const criticalCount = data.filter(i => {
                const a = i.ai_analysis;
                return a && (a.risk_level === 'Critical' || a.urgency === 'High');
            }).length;

            const salesCount = data.filter(i => 
                (i.program || '').toLowerCase().includes('shopee') || 
                (i.program || '').toLowerCase().includes('tokopedia')
            ).length;

            document.getElementById('stat-potential').innerText = `Rp ${totalPotential.toLocaleString('id-ID')}`;
            document.getElementById('stat-critical').innerText = criticalCount;
            document.getElementById('stat-sales').innerText = salesCount;
            document.getElementById('stat-total').innerText = data.length;
        }

        function switchTab(tab) {
            renderTab(tab);
        }
    </script>
</body>
</html>
